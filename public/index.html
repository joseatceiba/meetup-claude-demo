<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorten a link</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Shorten a link</h1>
    <p class="subtitle">Paste a long URL and get a short one back.</p>

    <form id="form" novalidate>
      <label class="visually-hidden" for="url">Long URL</label>
      <div class="row">
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off"
               placeholder="https://example.com/a/very/long/link" required autofocus>
        <button id="submit" type="submit">Shorten</button>
      </div>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <div id="result" class="result" hidden>
      <span class="result-label">Your short link</span>
      <div class="row">
        <a id="short-link" class="short-link" target="_blank" rel="noopener"></a>
        <button id="copy" type="button" class="secondary">Copy</button>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
